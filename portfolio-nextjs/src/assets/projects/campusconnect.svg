<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0e1f1c"/>
      <stop offset="58%" stop-color="#07100f"/>
      <stop offset="100%" stop-color="#030604"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#8ff0cf"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15322b"/>
      <stop offset="100%" stop-color="#0a1814"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="52" cy="46" r="1.1" opacity="0.7"/>
    <circle cx="150" cy="28" r="1" opacity="0.5"/>
    <circle cx="244" cy="62" r="1.3" opacity="0.6"/>
    <circle cx="340" cy="26" r="1" opacity="0.45"/>
    <circle cx="430" cy="56" r="1.2" opacity="0.7"/>
    <circle cx="540" cy="30" r="1" opacity="0.5"/>
    <circle cx="630" cy="26" r="1.3" opacity="0.6"/>
    <circle cx="734" cy="50" r="1" opacity="0.5"/>
    <circle cx="770" cy="110" r="1.1" opacity="0.7"/>
    <circle cx="70" cy="390" r="1" opacity="0.5"/>
    <circle cx="190" cy="382" r="1.2" opacity="0.6"/>
    <circle cx="320" cy="392" r="1" opacity="0.45"/>
    <circle cx="470" cy="386" r="1.1" opacity="0.55"/>
    <circle cx="600" cy="392" r="1" opacity="0.5"/>
    <circle cx="740" cy="374" r="1.2" opacity="0.6"/>
    <circle cx="120" cy="230" r="1" opacity="0.4"/>
    <circle cx="270" cy="130" r="1.1" opacity="0.5"/>
    <circle cx="150" cy="140" r="1" opacity="0.4"/>
  </g>

  <!-- event ticker line -->
  <g stroke="#34d399" stroke-opacity="0.12">
    <path d="M0 346 H800" stroke-dasharray="none"/>
    <path d="M0 60 H800"/>
  </g>
  <circle cx="800" cy="60" r="3" fill="#34d399" opacity="0.7"/>
  <circle cx="0" cy="346" r="3" fill="#34d399" opacity="0.7"/>

  <!-- ticket motif -->
  <g transform="translate(648,180) rotate(-8)">
    <rect x="-88" y="-62" width="176" height="124" rx="18" fill="#0a1814" stroke="#34d399" stroke-opacity="0.65" stroke-width="2.4"/>
    <!-- ticket notches -->
    <path d="M0 -14 a14 14 0 0 0 0 28" fill="#030604"/>
    <path d="M0 -14 a14 14 0 0 1 0 28" fill="#030604"/>
    <!-- perforation -->
    <line x1="-62" y1="0" x2="62" y2="0" stroke="#34d399" stroke-opacity="0.5" stroke-dasharray="3 4"/>
    <!-- barcode -->
    <g fill="#9ff0d4" opacity="0.9">
      <rect x="-70" y="-44" width="5" height="26"/>
      <rect x="-61" y="-44" width="2.5" height="26"/>
      <rect x="-53" y="-44" width="6" height="26"/>
      <rect x="-42" y="-44" width="2.5" height="26"/>
      <rect x="-35" y="-44" width="5" height="26"/>
      <rect x="-26" y="-44" width="3" height="26"/>
      <rect x="-18" y="-44" width="6" height="26"/>
    </g>
    <!-- seats -->
    <g fill="#fbbf24" opacity="0.9">
      <rect x="62" y="-34" width="9" height="6" rx="1.5"/>
      <rect x="62" y="-22" width="9" height="6" rx="1.5"/>
      <rect x="62" y="-10" width="9" height="6" rx="1.5"/>
      <rect x="62" y="2" width="9" height="6" rx="1.5"/>
      <rect x="62" y="14" width="9" height="6" rx="1.5"/>
    </g>
    <text x="-44" y="46" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="13" fill="#34d399" letter-spacing="1.5">CCSEVNT</text>
  </g>

  <!-- title -->
  <text x="56" y="150" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="52" fill="url(#title)" letter-spacing="1.5">CampusConnect</text>
  <text x="58" y="184" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="600" font-size="15.5" fill="#8fd3bd" letter-spacing="4">COLLEGE EVENT MANAGEMENT &amp; REGISTRATION</text>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="12.5" fill="#d3f5e8">
    <rect x="56" y="232" width="82" height="30" rx="15" fill="url(#chip)" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="97" y="252" text-anchor="middle">REACT</text>
    <rect x="150" y="232" width="104" height="30" rx="15" fill="url(#chip)" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="202" y="252" text-anchor="middle">TYPESCRIPT</text>
    <rect x="266" y="232" width="100" height="30" rx="15" fill="url(#chip)" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="316" y="252" text-anchor="middle">SUPABASE</text>
    <rect x="378" y="232" width="96" height="30" rx="15" fill="url(#chip)" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="426" y="252" text-anchor="middle">TAILWIND</text>
  </g>
</svg>