<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#101b30"/>
      <stop offset="58%" stop-color="#070c19"/>
      <stop offset="100%" stop-color="#03050b"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38e1ff"/>
      <stop offset="55%" stop-color="#9fd9ff"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182a44"/>
      <stop offset="100%" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38e1ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38e1ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="48" cy="52" r="1.1" opacity="0.75"/>
    <circle cx="140" cy="30" r="1" opacity="0.5"/>
    <circle cx="230" cy="64" r="1.3" opacity="0.6"/>
    <circle cx="330" cy="24" r="1" opacity="0.45"/>
    <circle cx="420" cy="58" r="1.2" opacity="0.7"/>
    <circle cx="520" cy="36" r="1" opacity="0.5"/>
    <circle cx="610" cy="24" r="1.3" opacity="0.65"/>
    <circle cx="720" cy="46" r="1" opacity="0.5"/>
    <circle cx="770" cy="96" r="1.1" opacity="0.7"/>
    <circle cx="96" cy="96" r="1" opacity="0.4"/>
    <circle cx="700" cy="380" r="1.2" opacity="0.6"/>
    <circle cx="60" cy="380" r="1" opacity="0.5"/>
    <circle cx="180" cy="392" r="1.1" opacity="0.55"/>
    <circle cx="480" cy="390" r="1" opacity="0.45"/>
    <circle cx="320" cy="382" r="1.3" opacity="0.6"/>
    <circle cx="760" cy="300" r="1" opacity="0.5"/>
    <circle cx="120" cy="210" r="1" opacity="0.4"/>
    <circle cx="290" cy="120" r="1.1" opacity="0.5"/>
  </g>

  <!-- docking bay grid -->
  <g stroke="#38e1ff" opacity="0.12">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="640" y1="0" x2="640" y2="420"/>
  </g>

  <!-- docking beacon / target motif -->
  <g transform="translate(656,178)">
    <circle r="92" fill="none" stroke="#38e1ff" stroke-opacity="0.16" stroke-width="2"/>
    <circle r="74" fill="none" stroke="#38e1ff" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="56" fill="none" stroke="#38e1ff" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="7 5"/>
    <circle r="38" fill="none" stroke="#f5c542" stroke-opacity="0.85" stroke-width="1.6"/>
    <line x1="0" y1="-98" x2="0" y2="98" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="1.4"/>
    <line x1="-98" y1="0" x2="98" y2="0" stroke="#38e1ff" stroke-opacity="0.5" stroke-width="1.4"/>
    <!-- docking beam -->
    <polygon points="-22,-58 22,-58 30,98 -30,98" fill="url(#beam)"/>
    <!-- drone -->
    <circle cx="0" cy="0" r="10" fill="#0b1424" stroke="#f5c542" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="4" fill="#38e1ff"/>
  </g>

  <!-- title -->
  <text x="56" y="152" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" font-size="62" fill="url(#title)" letter-spacing="3">V-DOCKX</text>
  <text x="58" y="188" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#9fb7de" letter-spacing="4.5">VISION-BASED AUTONOMOUS ROBOT DOCKING</text>

  <!-- tech chips -->
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="12.5" fill="#d7ecff">
    <rect x="56" y="232" width="82" height="30" rx="15" fill="url(#chip)" stroke="#38e1ff" stroke-opacity="0.4"/>
    <text x="97" y="252" text-anchor="middle">PYTHON</text>
    <rect x="150" y="232" width="88" height="30" rx="15" fill="url(#chip)" stroke="#38e1ff" stroke-opacity="0.4"/>
    <text x="194" y="252" text-anchor="middle">FASTAPI</text>
    <rect x="250" y="232" width="88" height="30" rx="15" fill="url(#chip)" stroke="#38e1ff" stroke-opacity="0.4"/>
    <text x="294" y="252" text-anchor="middle">NEXT.JS</text>
    <rect x="350" y="232" width="88" height="30" rx="15" fill="url(#chip)" stroke="#38e1ff" stroke-opacity="0.4"/>
    <text x="394" y="252" text-anchor="middle">OPENCV</text>
    <rect x="450" y="232" width="88" height="30" rx="15" fill="url(#chip)" stroke="#f5c542" stroke-opacity="0.4"/>
    <text x="494" y="252" text-anchor="middle">DOCKER</text>
  </g>
</svg>